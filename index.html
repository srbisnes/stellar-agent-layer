<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Agent Layer · Investor Ready</title>
    <meta name="description" content="AI Agent Layer on Stellar Testnet with Human-in-the-Loop safety gate, USDC→ARS off-ramp and institutional black & gold design." />
    <script>
      // Safety guards against wallet extension conflicts
      (function () {
        try {
          const originalDefine = Object.defineProperty;
          Object.defineProperty = function (obj, prop, desc) {
            if (prop === "ethereum" && (obj === window || obj === globalThis)) {
              desc = { ...desc, configurable: true, writable: true };
            }
            return originalDefine.call(this, obj, prop, desc);
          };
        } catch (e) {}
        window.addEventListener("error", function (e) {
          if (e.message && (e.message.includes("ethereum") || e.message.includes("fetch"))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#09090b] text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
